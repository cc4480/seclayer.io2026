name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck MCP server
        run: npm run lint -w @seclayer/mcp

      - name: Test MCP server
        run: npm test -w @seclayer/mcp

      - name: Build MCP server
        run: npm run build -w @seclayer/mcp

      # Railway deploys from this same push independently of this workflow, so
      # this doesn't wait on it — IndexNow's own crawl isn't instant either.
      # Never fails the build: a missed ping just falls back to organic crawl.
      - name: Ping IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow-ping.mjs https://seclayer.app
