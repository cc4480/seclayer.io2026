# Convenience wrapper around `docker build` + `docker run` (see DEPLOY.md §3).
# Builds the same self-hosted image — nmap included. The image sets NO file
# capabilities on nmap and runs as root, so it execs everywhere; NET_RAW below
# is what upgrades Network Reconnaissance to full SYN + OS-detection scans.
# NET_RAW is already in Docker's default capability set, so this line is
# belt-and-suspenders (it also survives hardened cap-drop bases). Omit it and
# nmap still works — the app detects the missing raw-socket capability at boot
# and runs a TCP connect scan instead (no OS detection). NET_ADMIN is NOT
# needed. Copy .env.example to .env and fill in at least APP_URL +
# RESEND_API_KEY before `docker compose up` (the app refuses to boot in
# production without them — see server/config.ts).
services:
  seclayer:
    build: .
    container_name: seclayer
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - seclayer-data:/data

volumes:
  seclayer-data:
